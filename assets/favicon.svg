<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- LYU-NAILS: минималистичная бирюзовая орхидея -->
  <rect width="64" height="64" rx="14" fill="#E7F4F3"/>
  <g fill="#2CB1B1">
    <!-- пять лепестков орхидеи -->
    <ellipse cx="32" cy="15.5" rx="6.4" ry="10" />
    <ellipse cx="17.5" cy="26" rx="9.6" ry="6.2" transform="rotate(-28 17.5 26)"/>
    <ellipse cx="46.5" cy="26" rx="9.6" ry="6.2" transform="rotate(28 46.5 26)"/>
    <ellipse cx="22" cy="41" rx="7.6" ry="5.6" transform="rotate(-58 22 41)"/>
    <ellipse cx="42" cy="41" rx="7.6" ry="5.6" transform="rotate(58 42 41)"/>
  </g>
  <!-- сердцевина -->
  <circle cx="32" cy="30" r="5.2" fill="#1F8A8A"/>
  <circle cx="32" cy="30" r="2.2" fill="#E7F4F3"/>
  <!-- монограмма LYU -->
  <text x="32" y="58" text-anchor="middle" font-family="Georgia, serif" font-size="12.5" letter-spacing="1.5" fill="#1F8A8A">LYU</text>
</svg>
